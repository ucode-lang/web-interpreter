# Phase 1: plain HTTP + ACME challenge, used until the first cert is staged.
# Swap in haproxy.cfg.tls once /etc/certificates has a <domain>.pem pair.
global
    log 127.0.0.1:514 local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout tunnel 3600s

frontend http
    bind *:80
    acl is_acme path_beg /.well-known/acme-challenge
    use_backend acme if is_acme
    default_backend ucodepen

backend acme
    server acme 127.0.0.1:8081

backend ucodepen
    server ucodepen 127.0.0.1:8000
